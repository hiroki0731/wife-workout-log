<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自宅筋トレ記録</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="筋トレ記録">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#087EA5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* 画面：上にタブの中身、下に3つのタブ（今日・記録・設定）。スマホ縦持ちが前提 */
:root{
  --teal:#087EA5;--deep:#003E52;--pale:#EAF5F8;--light:#9CCBDB;--accent:#FD9191;--good:#2e9e6b;--hot:#E8505B;--bonus:#F0A028;--gold:#FFCE3C;
  --ink:#243038;--muted:#5b6b73;--line:#d7e6ec;--ground:#F6FAFB;--paper:#fff;--soft:#ECF2F4;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --teal:#2b9cc2;--deep:#cfe9f2;--pale:#15323c;--light:#2d5f70;--ink:#e3ecef;--muted:#9fb1b8;--line:#28414a;
  --ground:#0d181c;--paper:#152328;--soft:#1c2d33;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
/* クリアした日は黄色、目標達成の日は黄色からオレンジ・ピンクの背景（白い札の後ろだけに出る） */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .4s}
body.day-clear::before{opacity:1;background:linear-gradient(135deg,rgba(255,206,60,.32),rgba(255,206,60,.14) 55%,rgba(240,160,40,.08))}
body.day-goal::before{opacity:1;background:linear-gradient(135deg,rgba(255,206,60,.42),rgba(240,160,40,.24) 55%,rgba(253,145,145,.30))}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
input{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 86px)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--paper);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--teal)}
h1{font-size:24px;margin:0;color:var(--deep);font-weight:800}
.sub{font-size:13px;color:var(--muted)}
.sub.rest{color:var(--bonus);font-weight:700}
.card{background:var(--paper);border-radius:14px;padding:14px;margin:12px 0;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--teal);color:#fff}
.lbl{font-size:13px;font-weight:700}
.num{width:64px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);text-align:right;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:700;background:var(--teal);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.deep{background:var(--deep);color:var(--paper)}
.btn:disabled{opacity:.4}
.pill{border:0;border-radius:999px;padding:6px 13px;font-weight:700;font-size:13px;background:var(--soft)}
.pill.sm{padding:4px 10px;font-size:12px}
.ok{color:var(--good)}
.banner{display:flex;gap:12px;align-items:center}
.banner .ic{font-size:26px}
.banner.bonus{background:color-mix(in srgb,var(--bonus) 14%,var(--paper));border:1px solid var(--bonus)}
.banner b{font-size:16px}
.summary{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:72px;height:72px;flex:none}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.15}
.ring .t i{font-style:normal;color:var(--hot);font-size:12px}
.head{font-size:18px;font-weight:800}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;color:#fff;white-space:nowrap}
.ex h3{margin:0;font-size:17px;color:var(--deep);display:flex;align-items:center;gap:6px}
.ex .meta{font-size:13px;color:var(--muted);margin:2px 0 6px}
.dots{display:flex;align-items:center;gap:5px}
.dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
.dot.empty{border:2px solid var(--teal)}
.dot.opt{border:2px dashed color-mix(in srgb,var(--muted) 60%,transparent)}
.dot.c{background:var(--teal)}
.dot.x{background:var(--hot)}
.dsep{width:1px;height:16px;background:var(--line)}
.steps{display:flex;gap:10px;margin:10px 0 8px}
.stepper{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:10px;padding:4px}
.stepper button{width:40px;height:40px;border:0;border-radius:8px;background:var(--paper);font-size:22px;font-weight:700;color:var(--teal)}
.stepper span{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.done{width:100%;padding:13px;font-size:16px}
.undo{border:0;background:none;color:var(--muted);font-size:13px;padding:8px 0 0}
.undo:disabled{display:none}
.sug{margin-top:8px;font-size:13px;background:color-mix(in srgb,var(--accent) 22%,var(--paper));border-radius:8px;padding:7px 10px;color:var(--deep);font-weight:600}
.reps{font-size:13px;color:var(--muted);margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:800;color:var(--deep);font-variant-numeric:tabular-nums}
.tile .v.g{color:var(--good)}
.tile .v small{font-size:15px;color:var(--bonus);margin-left:6px}
h2{font-size:16px;margin:0 0 10px;color:var(--deep);white-space:nowrap}
.heat{display:flex;gap:3px}
.heat .col{display:flex;flex-direction:column;gap:3px}
.cell{width:21px;height:21px;border-radius:4px;position:relative;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff}
.cell.rest{border:1px dashed color-mix(in srgb,var(--muted) 50%,transparent)}
.cell.sel{outline:2px solid var(--accent);outline-offset:1px}
.cell .b{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--bonus);border:1px solid var(--paper)}
.dn{width:14px;height:21px;font-size:10px;color:var(--muted);display:flex;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .c{border-radius:6px;padding:5px 0;font-size:11px;font-weight:700;color:var(--muted);background:var(--soft)}
.cal .c.on{color:#fff}
.cal .h{font-size:10px;color:var(--muted)}
.lrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;gap:8px}
.lrow:first-child{border-top:0}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .v{white-space:nowrap;font-variant-numeric:tabular-nums}
.del{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 6px;white-space:nowrap}
.del.arm{color:var(--hot);font-weight:800}
svg.chart{width:100%;height:170px;display:block}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}
.set{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);gap:10px}
.set:first-child{border-top:0}
.set>span,.set .sub{white-space:nowrap}
.mini{display:flex;align-items:center;gap:6px}
.mini{gap:4px}
.mini button{width:30px;height:30px;border:0;border-radius:8px;background:var(--soft);font-size:18px;font-weight:700;color:var(--teal)}
.mini span{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.wd{display:flex;gap:4px}
.wd{flex-wrap:wrap;justify-content:flex-end}
.wd button{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-weight:700}
.wd button.on{background:var(--muted);color:#fff;border-color:var(--muted)}
.exname{border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;background:var(--paper);margin-bottom:8px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:var(--deep);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* 日付の行と、前の日に戻したとき */
.dayhead{display:flex;align-items:center;gap:4px}
.dayhead .nav{width:36px;height:40px;border:0;background:none;color:var(--teal);font-size:26px;font-weight:700;padding:0;flex:none}
.dayhead .nav:disabled{color:var(--line)}
.past{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--accent) 18%,var(--paper));border:1px solid var(--accent);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13px;font-weight:700;color:var(--deep)}
.past .btn{padding:6px 10px;font-size:13px;white-space:nowrap}
/* 体重・お菓子・プロテインを1枚にまとめた札 */
.habits{padding:0 14px}
.hrow{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.hrow:first-child{border-top:0}
.hrow .lbl{width:68px;flex:none}
.hrow .st{font-size:13px;font-weight:800;white-space:nowrap}
.hnote{font-size:12px;color:var(--muted);margin:-6px 0 0 76px;padding-bottom:10px}
.hnote.ok{color:var(--good);font-weight:800}
/* お祝い */
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.celebrate{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.3);opacity:0;font-size:40px;font-weight:900;color:var(--teal);
  text-shadow:0 0 14px #fff,0 0 4px #fff;pointer-events:none;z-index:31;white-space:nowrap;animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
.celebrate.goal{color:var(--hot)}
.celebrate.out{transition:opacity .6s,transform .6s;opacity:0 !important;transform:translate(-50%,-50%) scale(.6) !important}
@keyframes pop{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>
<script>
'use strict';
// ===== データ =====
const KEY = 'home-workout-log-web:v1';
const DEMO = new URLSearchParams(location.search).has('demo');

const INITIAL = {
  version: 1,
  exercises: [
    {id:'row', name:'ワンハンドロー', kind:'a', order:0, targetReps:12, weight:6, perSide:true, progress:'weight',
      tip:'肘を腰のポケットに向かって引く。左右それぞれ'},
    {id:'pushup', name:'ベンチ腕立て伏せ', kind:'a', order:1, targetReps:10, weight:0, perSide:false, progress:'reps', repsStep:2, repsCap:15,
      capNote:'15回が楽なら、一段低い場所（膝つき→床）へ進みましょう', tip:'頭からかかとまで一直線。できなければテーブルに手をつく'},
    {id:'overhead', name:'オーバーヘッド・エクステンション', kind:'a', order:2, targetReps:12, weight:5, perSide:false, progress:'weight',
      tip:'座ってやる。肘を天井に向けたまま、肘から先だけ動かす'},
    {id:'kneeroller', name:'膝コロ', kind:'a', order:3, targetReps:8, weight:0, perSide:false, progress:'reps', repsStep:1, repsCap:12,
      capNote:'12回が楽なら、転がす距離を少し伸ばしましょう', tip:'背中を丸めたまま。腰が反る手前で戻る'},
    {id:'bulgarian', name:'ブルガリアンスクワット', kind:'b', order:0, targetReps:10, weight:0, perSide:true, progress:'weight',
      tip:'上体を少し前に倒すとお尻に効く。片脚ずつ'},
    {id:'rdl', name:'ルーマニアンデッドリフト', kind:'b', order:1, targetReps:12, weight:6, perSide:false, progress:'weight',
      tip:'太ももの裏が突っ張ったところで止める。腰は丸めない'},
    {id:'hipthrust', name:'ヒップスラスト', kind:'b', order:2, targetReps:15, weight:10, perSide:false, progress:'weight',
      tip:'肩甲骨をベンチに乗せ、腰にタオルを挟んでダンベルを置く'},
  ],
  logs: [], dayKinds: {}, clearSets: 2, goalSets: 3, weightStep: 1, minWeight: 5, weeklyGoal: 3,
  restWeekdays: [], bodyLogs: [], snacks: {}, protein: {}, proteinClear: 1,
};

function load() {
  if (DEMO) return demoData();
  try {
    const s = localStorage.getItem(KEY);
    if (s) return Object.assign(structuredClone(INITIAL), JSON.parse(s));
  } catch (e) {}
  return structuredClone(INITIAL);
}
let data;   // 読み込みは下の部品がそろってから（一番下で load する）
function save() {
  if (DEMO) return;
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast('保存できませんでした'); }
}
// ホーム画面のアプリは消されにくいが、念のためブラウザに長期保存をお願いする
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

// ===== 日付 =====
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const dayLabel = k => { const d = dateOf(k); return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const timeLabel = iso => { const d = new Date(iso); return `${d.getHours()}:${pad(d.getMinutes())}`; };
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const todayKey = () => keyOf(new Date());
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

// ===== 記録の計算 =====
const exById = id => data.exercises.find(e => e.id === id);
const exercisesOf = kind => data.exercises.filter(e => e.kind === kind).sort((a, b) => a.order - b.order);
const logsOn = (k, exId) => data.logs.filter(l => keyOf(new Date(l.date)) === k && (!exId || l.ex === exId));
const kg = w => Number.isInteger(w) ? String(w) : w.toFixed(1);
const wText = w => w === 0 ? '自重' : `${kg(w)}kg`;
const isRest = k => data.restWeekdays.includes(dateOf(k).getDay());

function kindFor(k) {
  if (data.dayKinds[k]) return data.dayKinds[k];
  const logs = logsOn(k);
  if (logs.length) {
    const a = logs.filter(l => (exById(l.ex) || {}).kind === 'a').length;
    return a * 2 >= logs.length ? 'a' : 'b';
  }
  const prev = [...new Set(data.logs.map(l => keyOf(new Date(l.date))))].filter(d => d < k).sort().pop();
  if (prev) return kindFor(prev) === 'a' ? 'b' : 'a';
  return 'a';
}
function statusFor(k) {
  const logs = logsOn(k);
  if (!logs.length) return 'none';
  const counts = exercisesOf(kindFor(k)).map(e => logs.filter(l => l.ex === e.id).length);
  if (counts.every(c => c >= data.goalSets)) return 'goal';
  if (counts.every(c => c >= data.clearSets)) return 'clear';
  return 'partial';
}
const STATUS = {
  none: {label: '記録なし', color: 'var(--soft)'},
  partial: {label: '途中', color: 'var(--light)'},
  clear: {label: 'クリア', color: 'var(--teal)'},
  goal: {label: '目標達成', color: 'var(--hot)'},
};
const nextWeight = w => w < data.minWeight ? data.minWeight : w + data.weightStep;
const prevWeight = w => { const n = w - data.weightStep; return n < data.minWeight ? 0 : n; };

// 前回その種目をやった日に全セット達成していたら、次の一歩を提案する
function suggestion(ex, k) {
  const days = [...new Set(data.logs.filter(l => l.ex === ex.id).map(l => keyOf(new Date(l.date))))].filter(d => d < k).sort();
  const last = days.pop();
  if (!last) return null;
  const sets = logsOn(last, ex.id);
  if (sets.length < data.clearSets || !sets.every(s => s.reps >= ex.targetReps)) return null;
  if (ex.progress === 'reps') {
    const r = ex.targetReps + (ex.repsStep || 2);
    if (r <= (ex.repsCap || 15)) return {reps: r, weight: ex.weight, msg: `前回は全セット達成。今日は${r}回を入れてあります`};
    return {reps: ex.targetReps, weight: ex.weight, msg: ex.capNote || '回数は上限です'};
  }
  const w = nextWeight(Math.max(ex.weight, ...sets.map(s => s.weight)));
  return {reps: ex.targetReps, weight: w, msg: `前回は全セット達成。今日は${wText(w)}を入れてあります`};
}
// 記録する時刻：今日なら今、前の日なら、その日の今と同じ時刻
function logDateFor(k) {
  const now = new Date();
  if (k === keyOf(now)) return now;
  const d = dateOf(k); d.setHours(now.getHours(), now.getMinutes(), now.getSeconds());
  return d;
}
const RANK = {none: 0, partial: 1, clear: 2, goal: 3};
function addSet(ex, reps, weight, k = todayKey()) {
  const before = statusFor(k);
  data.logs.push({id: uid(), date: logDateFor(k).toISOString(), ex: ex.id, reps, weight});
  if (ex.progress === 'reps' && reps > ex.targetReps) ex.targetReps = reps;
  ex.weight = weight;
  save();
  const after = statusFor(k);
  return RANK[after] > RANK[before] && RANK[after] >= RANK.clear ? after : null;   // クリアや目標達成に届いた瞬間ならその状態
}
function undoLast(ex, k = todayKey()) {
  const mine = data.logs.filter(l => l.ex === ex.id && keyOf(new Date(l.date)) === k);
  const last = mine[mine.length - 1];
  if (last) { data.logs = data.logs.filter(l => l !== last); save(); }
}
function trainedSplit(from, to) {
  const days = new Set(data.logs.filter(l => { const d = new Date(l.date); return d >= from && d < to; }).map(l => keyOf(new Date(l.date))));
  const bonus = [...days].filter(isRest).length;
  return {planned: days.size - bonus, bonus};
}
const bodyOn = k => data.bodyLogs.find(b => b.day === k);
function setBody(k, weight, waist) {
  data.bodyLogs = data.bodyLogs.filter(b => b.day !== k);
  if (weight != null || waist != null) data.bodyLogs.push({day: k, weight, waist});
  data.bodyLogs.sort((a, b) => a.day < b.day ? -1 : 1);
  save();
}
function weightAvg(endKey) {
  const end = dateOf(endKey), start = addDays(end, -6);
  const ws = data.bodyLogs.filter(b => b.weight != null && dateOf(b.day) >= start && dateOf(b.day) <= end).map(b => b.weight);
  return ws.length >= 3 ? ws.reduce((a, b) => a + b, 0) / ws.length : null;
}
const SNACK = {
  none: {label: 'ゼロ', color: 'var(--good)'},
  little: {label: '少し', color: 'var(--bonus)'},
  much: {label: '食べた', color: 'var(--hot)'},
};
function toggleSnack(k, lv) { if (data.snacks[k] === lv) delete data.snacks[k]; else data.snacks[k] = lv; save(); }
function snackStreak() {
  let d = new Date();
  if (!data.snacks[keyOf(d)]) d = addDays(d, -1);
  let n = 0;
  while (data.snacks[keyOf(d)] === 'none') { n++; d = addDays(d, -1); }
  return n;
}

// クリアや目標達成に届いた瞬間に、紙吹雪を降らせて大きな文字を出す（約4秒で消える）
function celebrate(st) {
  const goal = st === 'goal';
  if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { toast(goal ? '目標達成！' : '全種目クリア！'); return; }
  const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
  const W = innerWidth, H = innerHeight, dpr = devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const colors = goal ? ['#E8505B', '#FD9191', '#F0A028', '#E8505B', '#087EA5', '#2e9e6b'] : ['#087EA5', '#2e9e6b', '#FD9191', '#F0A028', '#087EA5'];
  const r = (a, b) => a + Math.random() * (b - a);
  const ps = [...Array(goal ? 170 : 100)].map(() => ({x: Math.random(), delay: r(0, .9), speed: r(160, 340), drift: r(-40, 40), spin: r(-6, 6),
    flip: r(4, 10), phase: r(0, 6.28), size: r(6, 11), color: colors[Math.floor(Math.random() * colors.length)]}));
  const big = document.createElement('div'); big.className = 'celebrate' + (goal ? ' goal' : ''); big.textContent = goal ? '目標達成！' : '全種目クリア！';
  document.body.appendChild(big);
  const t0 = performance.now(), dur = 4.2;
  (function frame(now) {
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, Math.min(1, dur - t));
    for (const p of ps) {
      const lt = t - p.delay;
      if (lt <= 0) continue;
      const y = -20 + p.speed * lt + 60 * lt * lt;
      if (y > H + 20) continue;
      ctx.save();
      ctx.translate(p.x * W + p.drift * lt + Math.sin(lt * 3 + p.phase) * 14, y);
      ctx.rotate(p.spin * lt + p.phase);
      ctx.scale(Math.max(.15, Math.abs(Math.cos(lt * p.flip + p.phase))), 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size * .35, p.size, p.size * .7);
      ctx.restore();
    }
    if (t < dur) requestAnimationFrame(frame); else cv.remove();
  })(t0);
  setTimeout(() => big.classList.add('out'), 1800);
  setTimeout(() => big.remove(), 2600);
}

  const ep = Object.keys(byDay).sort().map(dk => [dateOf(dk), byReps ? Math.max(...byDay[dk].map(l => l.reps)) : Math.max(...byDay[dk].map(l => l.weight))]);
  h += `<div class="card"><div class="row"><h2 style="margin:0">伸び</h2><span class="sp"></span>
    <select id="chartEx">${[...exercisesOf('a'), ...exercisesOf('b')].map(e => `<option value="${e.id}" ${e.id === ex.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select></div>
    ${ep.length < 2 ? `<div class="sub" style="margin-top:10px">記録が2日分たまると、その日の${byReps ? '最大回数' : '最大の重さ'}が線で出ます</div>` : chartSVG(null, ep, byReps ? '回' : 'kg')}</div>`;
  return h;
}

function chartSVG(points, line, unit) {
  const all = [...(points || []), ...line];
  const xs = all.map(p => +p[0]), ys = all.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y1 - y0 < 1) { y0 -= 0.5; y1 += 0.5; }
  const W = 320, H = 170, L = 34, R = 8, T = 10, B = 22;
  const X = x => L + (W - L - R) * (x1 === x0 ? 0.5 : (+x - x0) / (x1 - x0));
  const Y = y => T + (H - T - B) * (1 - (y - y0) / (y1 - y0));
  const fmt = v => (Math.abs(y1 - y0) < 5 ? v.toFixed(1) : Math.round(v));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  for (const v of [y0, (y0 + y1) / 2, y1]) s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${Y(v) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${fmt(v)}</text>`;
  const d0 = new Date(x0), d1 = new Date(x1);
  s += `<text x="${L}" y="${H - 6}" font-size="10" fill="var(--muted)">${d0.getMonth() + 1}/${d0.getDate()}</text><text x="${W - R}" y="${H - 6}" font-size="10" text-anchor="end" fill="var(--muted)">${d1.getMonth() + 1}/${d1.getDate()}</text>`;
  if (points) s += points.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="var(--teal)" opacity=".45"/>`).join('');
  if (line.length) s += `<polyline fill="none" stroke="var(--deep)" stroke-width="2.5" stroke-linejoin="round" points="${line.map(p => `${X(p[0])},${Y(p[1])}`).join(' ')}"/>` +
    (points ? '' : line.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5" fill="var(--deep)"/>`).join(''));
  s += `<text x="2" y="${T + 2}" font-size="10" fill="var(--muted)">${unit}</text></svg>`;
  if (points) s += '<div class="note">点は毎朝の体重、線は7日平均。1日ごとの上下は水分なので、線の向きだけを見ます</div>';
  return s;
}

function viewSettings() {
  const mini = (key, label) => `<div class="mini"><button data-set="${key}" data-d="-1">−</button><span>${label}</span><button data-set="${key}" data-d="1">＋</button></div>`;
  let h = `<h1>種目と目標</h1><div class="card">
    <div class="set"><span>クリアのセット数</span>${mini('clearSets', data.clearSets)}</div>
    <div class="set"><span>目標のセット数</span>${mini('goalSets', data.goalSets)}</div>
    <div class="set"><span>週の回数の目標</span>${mini('weeklyGoal', data.weeklyGoal + '回')}</div>
    <div class="set"><span>プロテインのクリア回数</span>${mini('proteinClear', data.proteinClear + '回')}</div>
    <div class="set" style="display:block"><span>休みの曜日</span><div class="wd" style="justify-content:space-between;margin-top:8px">${[1, 2, 3, 4, 5, 6, 0].map(d => `<button data-wd="${d}" class="${data.restWeekdays.includes(d) ? 'on' : ''}">${WD[d]}</button>`).join('')}</div></div>
    <div class="note">休みの曜日を選ぶと、その日は休みの日として表示され、やった分はプラスαとして別に数えます。決めない場合は空のままで大丈夫です。</div></div>`;
  for (const kind of ['a', 'b']) {
    h += `<div class="card"><h2>${kind === 'a' ? 'A 上半身と腹筋' : 'B 下半身'}</h2>`;
    for (const ex of exercisesOf(kind)) {
      h += `<div class="set" style="display:block"><input class="exname" data-name="${ex.id}" value="${esc(ex.name)}">
        <div class="row"><span class="sub">回数</span>${mini('reps:' + ex.id, ex.targetReps + '回')}<span class="sp"></span><span class="sub">重さ</span>${mini('weight:' + ex.id, wText(ex.weight))}</div></div>`;
    }
    h += '</div>';
  }
  h += `<div class="card"><h2>記録のバックアップ</h2>
    <div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn" id="exportBtn">記録を書き出す</button>
    <label class="btn ghost" style="display:inline-block">書き出した記録を読み込む<input type="file" id="importFile" accept="application/json,.json" hidden></label></div>
    <div class="note">記録はこのスマホの中だけに保存されています。機種変更の前に書き出して、新しいスマホで読み込んでください。</div></div>
    <div class="note" style="text-align:center">ダンベルは${data.minWeight}kgから${data.weightStep}kg刻み。0は自重です。</div>`;
  return h;
}

// ===== 操作 =====
document.addEventListener('click', e => {
  // 入力欄の外を押したら、キーボードを閉じてフォーカスを外す
  const ae = document.activeElement;
  if (ae && ae.matches('input') && !e.target.closest('input')) ae.blur();
  const t = e.target.closest('button,[data-sel]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) { tab = ds.tab; window.scrollTo(0, 0); render(); return; }
  if (ds.move) {
    const n = +ds.move;
    viewDay = n === 0 ? todayKey() : [keyOf(addDays(dateOf(viewDay), n)), todayKey()].sort()[0];
    render(); return;
  }
  if (ds.kind) { data.dayKinds[viewDay] = ds.kind; save(); render(); return; }
  if (ds.snack) { toggleSnack(ds.day, ds.snack); render(); return; }
  if (ds.protein) { toggleProtein(ds.day, ds.protein); render(); return; }
  if (ds.step) {
    const ex = exById(ds.ex), d = draft[`${viewDay}:${ex.id}`], n = +ds.d;
    if (ds.step === 'reps') d.reps = Math.max(1, Math.min(50, d.reps + n));
    else d.weight = n > 0 ? Math.min(40, nextWeight(d.weight)) : (d.weight === 0 ? 0 : prevWeight(d.weight));
    render(); return;
  }
  if (ds.done) {
    const ex = exById(ds.done), dk = `${viewDay}:${ex.id}`, d = draft[dk];
    const reached = addSet(ex, d.reps, d.weight, viewDay);
    const c = logsOn(viewDay, ex.id).length;
    render();
    if (reached) { celebrate(reached); return; }
    toast(c === data.clearSets ? `${ex.name} クリア！` : c === data.goalSets ? `${ex.name} 目標達成！` : `${c}セット目を記録しました`);
    if (navigator.vibrate) navigator.vibrate(15);
    return;
  }
  if (ds.undo) { undoLast(exById(ds.undo), viewDay); render(); return; }
  if (ds.sel) { selected = ds.sel; render(); return; }
  if (ds.del) {
    if (!t.classList.contains('arm')) { t.classList.add('arm'); t.textContent = 'もう一度押して削除'; setTimeout(() => { t.classList.remove('arm'); t.textContent = '削除'; }, 3000); return; }
    data.logs = data.logs.filter(l => l.id !== ds.del); save(); render(); return;
  }
  if (ds.wd) {
    const d = +ds.wd;
    data.restWeekdays = data.restWeekdays.includes(d) ? data.restWeekdays.filter(x => x !== d) : [...data.restWeekdays, d];
    save(); render(); return;
  }
  if (ds.set) {
    const n = +ds.d, [k, id] = ds.set.split(':');
    if (k === 'clearSets') { data.clearSets = Math.max(1, Math.min(5, data.clearSets + n)); data.goalSets = Math.max(data.goalSets, data.clearSets); }
    else if (k === 'goalSets') data.goalSets = Math.max(data.clearSets, Math.min(6, data.goalSets + n));
    else if (k === 'weeklyGoal') data.weeklyGoal = Math.max(1, Math.min(7, data.weeklyGoal + n));
    else if (k === 'proteinClear') data.proteinClear = Math.max(1, Math.min(3, data.proteinClear + n));
    else if (k === 'reps') { const ex = exById(id); ex.targetReps = Math.max(1, Math.min(50, ex.targetReps + n)); }
    else if (k === 'weight') { const ex = exById(id); ex.weight = n > 0 ? Math.min(40, nextWeight(ex.weight)) : (ex.weight === 0 ? 0 : prevWeight(ex.weight)); }
    Object.keys(draft).forEach(x => delete draft[x]);
    save(); render(); return;
  }
  if (t.id === 'saveBody') {
    const v = parseFloat(($('#w').value || '').replace(',', '.'));
    if (isNaN(v) && !bodyOn(viewDay)) return;
    setBody(viewDay, isNaN(v) ? null : v, null);
    toast(isNaN(v) ? '体重の記録を消しました' : '体重を記録しました');
    render(); return;
  }
  if (t.id === 'exportBtn') { exportData(); return; }
});
// 体重の欄でEnter（キーボードの完了）を押したら記録する
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'w') { e.preventDefault(); e.target.blur(); $('#saveBody').click(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'chartEx') { chartEx = e.target.value; render(); }
  if (e.target.dataset.name) { const ex = exById(e.target.dataset.name); ex.name = e.target.value.trim() || ex.name; save(); }
  if (e.target.id === 'importFile') importData(e.target.files[0]);
});

async function exportData() {
  const name = `自宅筋トレ記録-${todayKey()}.json`;
  const blob = new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'});
  const file = new File([blob], name, {type: 'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function importData(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.logs) || !Array.isArray(d.exercises)) throw new Error();
      data = Object.assign(structuredClone(INITIAL), d); save(); toast(`読み込みました（${data.logs.length}セット）`); render();
    } catch (e) { toast('このファイルは読み込めませんでした'); }
  };
  r.readAsText(f);
}

// 画面確認用のサンプル（?demo を付けたときだけ。保存はしない）
function demoData() {
  const d = structuredClone(INITIAL), t = new Date();
  const at = (n, h) => { const x = addDays(t, -n); x.setHours(h, 0, 0, 0); return x.toISOString(); };
  const plan = [[13, 'a'], [11, 'b'], [9, 'a'], [6, 'b'], [4, 'a'], [2, 'b'], [0, 'a']];
  for (const [n, kind] of plan) for (const ex of d.exercises.filter(e => e.kind === kind)) {
    const c = n === 0 ? (ex.id === 'row' ? 3 : ex.id === 'kneeroller' ? 1 : 2) : n === 4 ? 3 : 2;
    for (let i = 0; i < c; i++) d.logs.push({id: uid(), date: at(n, 20), ex: ex.id, reps: ex.targetReps, weight: ex.weight + (n < 7 && ex.progress === 'weight' && ex.weight ? 1 : 0)});
  }
  for (let i = 20; i >= 0; i--) d.bodyLogs.push({day: keyOf(addDays(t, -i)), weight: +(56.4 - i * 0.02 + Math.sin(i) * 0.3).toFixed(1)});
  ['none', 'none', 'little', 'none', 'much', 'none', 'none', 'none', 'none'].forEach((lv, i) => d.snacks[keyOf(addDays(t, -i - 1))] = lv);
  [1, 2, 1, 1, 0, 1, 2, 1, 1, 0, 1].forEach((n, i) => { if (n) d.protein[keyOf(addDays(t, -i))] = PTIMES.slice(0, n).map(p => p[0]); });
  return d;
}

data = load();
render();
// 確認用：?celebrate=clear か goal で、開いた直後にお祝いを出す
{ const c = new URLSearchParams(location.search).get('celebrate'); if (c) setTimeout(() => celebrate(c), 300); }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
// 日付が変わったら今日の画面を新しくする
let lastDay = todayKey();
function rollDay() {
  const k = todayKey();
  if (k === lastDay) return;
  if (viewDay === lastDay) viewDay = k;   // 前の日を見ているときは、その日のままにする
  if (selected === lastDay) selected = k;
  lastDay = k; render();
}
setInterval(rollDay, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) rollDay(); });
</script>
